name: Sync to Codeberg

on:
  push:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror GitHub repo to Codeberg
        run: |
          git clone --mirror "https://github.com/${{ github.repository }}.git" repo
          cd repo
          git push --mirror "https://miaojiuqing:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/miaojiuqing/Maa_Kes.git"
