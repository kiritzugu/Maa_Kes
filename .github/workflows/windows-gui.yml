name: Windows GUI with letterbox toggle

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      MFA_SOURCE_REF: 450a8f3134d2b5ac3fce4fc8eeb3e745197b1717
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned MFAAvalonia source
        uses: actions/checkout@v4
        with:
          repository: SweetSmellFox/MFAAvalonia
          ref: ${{ env.MFA_SOURCE_REF }}
          path: build-windows/MFAAvalonia
          persist-credentials: false

      - name: Apply letterbox toggle
        run: |
          git -C build-windows/MFAAvalonia apply --check ../../.github/windows/letterbox.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C build-windows/MFAAvalonia apply ../../.github/windows/letterbox.patch

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore Windows GUI
        working-directory: build-windows/MFAAvalonia
        run: dotnet restore MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj -r win-${{ matrix.arch }} --source https://api.nuget.org/v3/index.json

      - name: Test crop and input mapping
        if: matrix.arch == 'x64'
        working-directory: build-windows/MFAAvalonia
        run: |
          foreach ($runtime in @('5.12.3', '5.14.2')) {
            dotnet restore MFAAvalonia.Letterbox.Tests/MFAAvalonia.Letterbox.Tests.csproj "-p:MaaRuntimeVersion=$runtime" --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet test MFAAvalonia.Letterbox.Tests/MFAAvalonia.Letterbox.Tests.csproj -c Release --no-restore "-p:MaaRuntimeVersion=$runtime"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish Windows GUI
        working-directory: build-windows/MFAAvalonia
        run: dotnet publish MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj -c Release -r win-${{ matrix.arch }} --no-restore --self-contained false -o ../publish

      - name: Include patch and upstream notice
        run: |
          $docs = 'build-windows/publish/docs/windows-letterbox'
          New-Item -ItemType Directory -Path $docs -Force | Out-Null
          Copy-Item -LiteralPath '.github/windows/letterbox.patch', '.github/windows/README.md' -Destination $docs
          Copy-Item -LiteralPath 'build-windows/MFAAvalonia/LICENSE' -Destination "$docs/MFAAvalonia.LICENSE"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-gui-${{ matrix.arch }}
          path: build-windows/publish
          if-no-files-found: error
